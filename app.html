<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>AFKeibaDATA</title>
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#111111">
<meta name="robots" content="noindex">
<style>
/* Layout: app shell = sticky top bar + content + fixed bottom tab bar; one race per screen; single light look on purpose (race content keeps the live site's inline colors) */
:root{
  --bg:#f3f2ef; --surface:#ffffff; --ink:#16130f; --muted:#6f685e; --line:#e6e2db;
  --brand:#111111; --accent:#e85d00; --accent-soft:#fff0e3;
  --turf:#2f7d3a; --turf-soft:#e5f3e7; --dirt:#8a5a2b; --dirt-soft:#f5eadf;
  --done:#b9b3aa; --warn:#b42318; --warn-soft:#fdecea; --g1:#1d4fb8; --g2:#c0262d; --g3:#1a8a3a;
  --sans:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",system-ui,sans-serif;
  --num:ui-rounded,"SF Pro Rounded","Hiragino Sans",system-ui,sans-serif;
  --tabh:58px; color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}body{margin:0}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.55;padding-bottom:calc(var(--tabh) + env(safe-area-inset-bottom,0px) + 12px)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
a{color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--brand)}
.wrap{max-width:560px;margin:0 auto}
.pad{padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--brand);color:#fff;border-bottom:3px solid var(--accent)}
.top .row{display:flex;align-items:center;gap:8px;min-height:50px}
.logo{font-weight:900;font-size:17px;letter-spacing:.02em;white-space:nowrap}.logo b{color:var(--accent)}
.back{display:flex;align-items:center;gap:4px;min-height:44px;min-width:44px;font-weight:700;font-size:15px}
.back svg{width:20px;height:20px}
.top .sp{flex:1}
.demo{font-size:11px;background:#2a2a2a;border-radius:20px;padding:6px 12px;min-height:40px;white-space:nowrap;color:#ffd9bf}
/* race strip */
.strip{display:flex;gap:6px;overflow-x:auto;padding:8px 0 10px;scrollbar-width:none;scroll-snap-type:x proximity}
.strip::-webkit-scrollbar{display:none}
.strip button{flex:0 0 auto;min-width:48px;height:44px;border-radius:22px;background:#2b2b2b;color:#ddd;font-weight:800;font-size:15px;padding:0 10px;scroll-snap-align:center;font-family:var(--num)}
.strip button.done{color:#8d8d8d}
.strip button.on{background:var(--accent);color:#fff}
.strip button.gr{box-shadow:inset 0 0 0 2px #d4af37}

/* hub */
.dates{display:flex;background:var(--surface);border-bottom:1px solid var(--line)}
.dates button{flex:1;min-height:50px;font-weight:800;color:var(--muted);border-bottom:3px solid transparent}
.dates button.on{color:var(--ink);border-bottom-color:var(--accent)}
.dates small{display:block;font-size:11px;font-weight:500}
.venues{display:flex;gap:8px;padding-block:12px}
.venues button{flex:1;min-height:48px;border-radius:10px;background:var(--surface);border:1px solid var(--line);font-weight:800;font-size:16px}
.venues button.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.rc{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 10px;min-height:92px;text-align:left;display:flex;flex-direction:column;gap:2px}
.rc .rn{font-family:var(--num);font-size:22px;font-weight:900;line-height:1}
.rc .rn small{font-size:12px}
.rc .tm{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.rc .cs{font-size:11px;font-weight:700;border-radius:4px;padding:0 5px;align-self:flex-start}
.cs.t{background:var(--turf-soft);color:var(--turf)}.cs.d{background:var(--dirt-soft);color:var(--dirt)}
.rc .nm{font-size:12px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.rc .flag{position:absolute;top:7px;right:7px;display:flex;gap:3px}
.rc.done{background:#ecebe8;color:var(--done)}.rc.done .cs{opacity:.55}.rc.done .tm{color:var(--done)}
.rc.next{border:2px solid var(--accent);padding:7px 9px}
.rc .left{font-size:11px;font-weight:800;color:var(--accent)}
.wap{display:inline-block;font-size:10px;font-weight:800;color:#fff;padding:1px 5px;border-radius:3px 3px 7px 7px;line-height:1.4}
.w-G1{background:var(--g1)}.w-G2{background:var(--g2)}.w-G3{background:var(--g3)}.w-L,.w-OP{background:#7a5b14}
.chip-up{font-size:10px;font-weight:800;color:var(--warn);background:var(--warn-soft);border-radius:8px;padding:0 5px}
.sec{font-size:13px;font-weight:800;color:var(--muted);letter-spacing:.04em;margin:22px 0 8px}
.picks{display:grid;gap:8px}
.pick{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 12px;min-height:60px;text-align:left;width:100%}
.pick .mk{font-size:22px;font-weight:900;color:var(--accent);text-align:center}
.pick b{display:block;font-size:15px}
.pick small{color:var(--muted);font-size:12px}
.pick .od{font-family:var(--num);font-weight:800;text-align:right;font-variant-numeric:tabular-nums}
.pick .od small{display:block;font-weight:500}
.note{font-size:12px;color:var(--muted);line-height:1.6;margin:10px 0}

/* race head */
.rh{background:var(--surface);border-bottom:1px solid var(--line);padding-block:12px}
.rh .l1{display:flex;gap:10px;align-items:center}
.rbox{flex:0 0 52px;height:52px;border-radius:8px;background:#1f2430;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.05}
.rbox span{font-size:11px;opacity:.85}.rbox b{font-size:22px;font-family:var(--num)}
.rh .nm{font-size:21px;font-weight:900;line-height:1.25}
.rh .meta{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:13px;color:var(--muted);margin-top:6px}
.rh .meta b{color:var(--ink)}
.rh .lnk{display:flex;align-items:center;min-height:44px;font-weight:700;color:var(--accent);text-decoration:none;font-size:14px;margin-top:4px}
/* tabs */
.tabs{position:sticky;z-index:15;display:flex;background:var(--surface);border-bottom:1px solid var(--line)}
.tabs button{flex:1;min-height:48px;font-weight:800;font-size:15px;color:var(--muted);border-bottom:3px solid transparent}
.tabs button.on{color:var(--ink);border-bottom-color:var(--accent)}
/* shutsuba */
.sorts{display:flex;gap:6px;padding-block:10px;align-items:center}
.sorts span{font-size:12px;color:var(--muted);margin-right:2px}
.sorts button{min-height:36px;padding:0 12px;border-radius:18px;background:var(--surface);border:1px solid var(--line);font-size:13px;font-weight:700}
.sorts button.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.tbl{background:var(--surface);border-top:1px solid var(--line)}
.hr{display:grid;grid-template-columns:30px 48px minmax(0,1fr) 58px;align-items:center;column-gap:8px;border-bottom:1px solid var(--line);min-height:58px;padding-right:12px}
.hr.th{min-height:30px;font-size:11px;color:var(--muted);font-weight:700;background:#faf9f7}
.hr.th div:first-child{padding-left:4px}
.waku{align-self:stretch;display:flex;align-items:center;justify-content:center;font-family:var(--num);font-weight:900;font-size:17px;border-right:1px solid var(--line)}
.myk{width:44px;height:44px;border-radius:10px;border:1.5px dashed #cfc9bf;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:20px;font-weight:900;color:var(--accent);line-height:1}
.myk.set{border:2px solid var(--accent);background:var(--accent-soft)}
.myk .au{color:#1d3f72;opacity:.75}
.sorts button:disabled{opacity:.35}
.myk small{font-size:9px;color:var(--muted);font-weight:700;margin-top:2px}
.hn{min-width:0;text-align:left;padding:6px 0;min-height:56px;display:flex;flex-direction:column;justify-content:center}
.hn .n1{display:flex;align-items:center;gap:6px;min-width:0}
.hn .nm{font-weight:800;font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hn .am{flex:0 0 auto;font-size:13px;font-weight:900;color:#fff;background:var(--accent);border-radius:4px;padding:0 4px;line-height:1.5}
.hn .am.o{background:#1d3f72}
.hn .n2{font-size:12px;color:var(--muted);display:flex;flex-wrap:wrap;gap:3px 5px;align-items:center;margin-top:2px}
.hn .n3{display:flex;flex-wrap:wrap;gap:4px;margin-top:3px}
.bd{white-space:nowrap;font-size:11px;font-weight:700;border-radius:4px;padding:0 5px;line-height:1.6;background:#f0eee9;color:#4c463e}
.bd.r1{background:#fff3c4;color:#6b4e00}.bd.s{background:#e7efff;color:#1d3f72}.bd.w{background:var(--warn-soft);color:var(--warn)}
.od{text-align:right;font-family:var(--num);font-variant-numeric:tabular-nums}
.od b{display:block;font-size:17px;font-weight:900}
.od small{font-size:11px;color:var(--muted)}
.od b.fav{color:var(--warn)}
/* panels with legacy html */
.panel{background:var(--surface);padding-block:12px;font-size:14px;overflow-wrap:break-word;line-break:strict}
.panel>div{margin:0 0 12px!important}
.panel details>summary{min-height:44px;display:flex;align-items:center}
.panel table{max-width:100%}
.empty{padding:28px 16px;text-align:center;color:var(--muted);font-size:14px;background:var(--surface)}
/* bet tab */
.betwrap{background:var(--surface);padding-block:12px}
.kbb>summary{min-height:48px}
/* bottom sheet */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.42);z-index:40;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;max-height:88vh;background:var(--surface);border-radius:16px 16px 0 0;transform:translateY(102%);transition:transform .25s ease;display:flex;flex-direction:column;max-width:560px;margin:0 auto;padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet.on{transform:none}
.sheet .sh{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--line)}
.sheet .sh .grab{position:absolute;left:50%;top:6px;width:40px;height:4px;border-radius:2px;background:#d6d1c9;transform:translateX(-50%)}
.sheet .sh b{flex:1;font-size:17px}
.sheet .x{width:44px;height:44px;border-radius:22px;background:#f0eee9;font-size:20px}
.sheet .sb{overflow-y:auto;-webkit-overflow-scrolling:touch;font-size:14px;overflow-wrap:break-word;line-break:strict}
.sheet .sb a[href^="#"]{pointer-events:none;color:inherit!important}
.sheet .mkrow{display:flex;gap:5px;padding:10px 12px;border-bottom:1px solid var(--line)}
.sheet .mkrow button{flex:1;min-width:0;height:44px;border-radius:10px;border:1px solid var(--line);font-size:19px;font-weight:900;color:var(--accent)}
.sheet .mkrow button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.sheet .ext{display:flex;align-items:center;justify-content:center;min-height:48px;margin:12px;border-radius:10px;background:#f0eee9;font-weight:800;text-decoration:none}
.hz{padding-block:12px;display:grid;gap:12px}
.hz-id{display:flex;gap:10px;align-items:center}
.hz-no{flex:0 0 40px;height:40px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:19px;border:1px solid #ccc;font-family:var(--num)}
.hz-id>div{flex:1;min-width:0}.hz-meta{font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:0 8px}.hz-meta span,.nw{white-space:nowrap}.hz-auto{font-size:13px}.hz-auto b{color:#1d3f72;font-size:16px}
.hz-od{text-align:right;font-family:var(--num)}.hz-od b{display:block;font-size:22px;font-weight:900;line-height:1.1}.hz-od small{font-size:12px;color:var(--muted)}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.tile{border:1px solid var(--line);border-radius:12px;padding:8px 10px;background:#faf9f7}
.tile.hi{border-color:var(--accent);background:var(--accent-soft)}
.tk{font-size:11px;font-weight:700;color:var(--muted)}.tv{font-size:22px;font-weight:900;font-family:var(--num);line-height:1.2}.ts{font-size:11px;color:var(--muted)}
.cap2{font-size:11px;color:var(--muted);margin:0}
.strip-svg{width:100%;height:auto;display:block}
.afrow{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;font-family:var(--num)}
.afrow div{display:flex;flex-direction:column}.afrow span{font-size:11px;color:var(--muted);font-family:var(--sans)}.afrow b{font-size:17px}.afrow small{font-size:10px;color:var(--muted);font-family:var(--sans);line-height:1.3}
.hh{margin:6px 0 0;font-size:15px}.hh small{font-size:11px;color:var(--muted);font-weight:500;margin-left:4px}
.bdv{display:grid;gap:2px}
.bdr{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr) 40px;gap:8px;align-items:center;min-height:40px;border-bottom:1px solid #f0ece6}
.bdn{font-size:13px;font-weight:700;line-height:1.3}.bdn small{display:block;font-weight:400;color:var(--muted);font-size:10.5px;font-family:var(--num)}
.bdb{height:10px;background:#efebe4;border-radius:5px;overflow:hidden}.bdb i{display:block;height:100%;background:#9aa7b8;border-radius:5px}
.bdr.bk-top .bdb i{background:var(--accent)}.bdr.bk-low .bdb i{background:#cfc8bd}
.bdk{text-align:right;font-family:var(--num);font-weight:900;font-size:16px}.bdk small{font-size:10px;color:var(--muted);font-weight:500}
.bdr.bk-top .bdk{color:var(--accent)}
.bds{display:flex;flex-wrap:wrap;gap:2px 10px;font-size:11px;color:var(--muted);padding:0 0 6px 10px}
.runs-svg{width:100%;height:auto;display:block}
.runs-raw{border-top:1px solid var(--line)}
.blood{font-size:12px;color:var(--muted);padding-block:10px}
.kbb .bar{bottom:calc(var(--tabh) + env(safe-area-inset-bottom,0px))!important;padding-bottom:8px!important}
.info{display:flex;align-items:center;min-height:44px;font-size:13px;font-weight:700;color:#1d3f72;text-decoration:none}
.notes{background:var(--surface);padding-block:8px 20px}
.notes h3{font-size:16px;margin:22px 0 6px;padding-top:4px}
.notes dl{margin:0;display:grid;grid-template-columns:7.5em minmax(0,1fr);border-top:1px solid var(--line)}
.notes dt,.notes dd{margin:0;padding:9px 0;border-bottom:1px solid var(--line);font-size:13.5px;line-height:1.6}
.notes dt{font-weight:800;padding-right:8px}
.notes dd{color:#3d372f}
.retry{margin-top:12px;min-height:44px;padding:0 18px;border-radius:10px;background:var(--brand);color:#fff;font-weight:800}
.sheet .sb{overscroll-behavior:contain}
@media (prefers-reduced-motion:reduce){.sheet,.scrim{transition:none}}
/* bottom tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tabbar .in{display:flex;max-width:560px;margin:0 auto}
.tabbar a,.tabbar button{flex:1;height:var(--tabh);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;font-weight:700;color:var(--muted);text-decoration:none}
.tabbar svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.tabbar .on{color:var(--accent)}
.menu a{display:flex;align-items:center;justify-content:space-between;min-height:54px;padding:0 16px;border-bottom:1px solid var(--line);text-decoration:none;font-weight:700}
.menu a small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.menu a::after{content:"›";color:var(--muted);font-size:20px}
</style>
</head>
<body>
<header class="top"><div class="wrap pad" id="topin"></div></header>
<main class="wrap" id="app"></main>

<div class="scrim" id="scrim"></div>
<section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="shTitle">
  <div class="sh"><span class="grab"></span><b id="shTitle"></b><button class="x" id="shClose" aria-label="閉じる">×</button></div>
  <div class="sb" id="shBody"></div>
</section>

</div></nav>

<script src="betbuilder.js"></script>
<script>
(function(){
'use strict';
var SITE='';
var ROMA={'東京':'tokyo','京都':'kyoto','福島':'fukushima','中山':'nakayama','阪神':'hanshin','新潟':'niigata','中京':'chukyo','札幌':'sapporo','函館':'hakodate','小倉':'kokura'};
var KANJI={};Object.keys(ROMA).forEach(function(k){KANJI[ROMA[k]]=k;});
var WAKU={1:['#ffffff','#111'],2:['#222222','#fff'],3:['#e53935','#fff'],4:['#1e5bd6','#fff'],5:['#f7d417','#111'],6:['#2e9d4a','#fff'],7:['#f08a1c','#fff'],8:['#f28fb4','#111']};
var MKS=['◎','○','▲','△','☆','✓'];
var GRADES={G1:1,G2:1,G3:1,L:1,OP:1,'J・G1':1,'J・G2':1,'J・G3':1};
var IDX=null, cache={}, st={demo:false, tab:'shutsuba', sort:'no'};
var app=document.getElementById('app'), topin=document.getElementById('topin');
function ls(k,v){try{if(v===undefined)return localStorage.getItem(k);if(v==='')localStorage.removeItem(k);else localStorage.setItem(k,v);}catch(e){return null;}}
try{var s0=ls('proto_sort');if(s0)st.sort=s0;}catch(e){}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function dlabel(d){var dt=new Date(2000+ +d.slice(0,2),+d.slice(2,4)-1,+d.slice(4,6));return (+d.slice(2,4))+'/'+(+d.slice(4,6))+'('+'日月火水木金土'[dt.getDay()]+')';}
// "now" in JST minutes since epoch-day; demo clock = 11/14 13:30
function nowJst(){if(st.demo)return{d:'261114',m:13*60+30};var t=new Date(Date.now()+9*3600e3);var d=String(t.getUTCFullYear()).slice(2)+('0'+(t.getUTCMonth()+1)).slice(-2)+('0'+t.getUTCDate()).slice(-2);return{d:d,m:t.getUTCHours()*60+t.getUTCMinutes()};}
function mins(tm){var p=tm.split(':');return +p[0]*60+ +p[1];}
function stateOf(d,tm){var n=nowJst();if(d<n.d)return'done';if(d>n.d)return'future';return mins(tm)<=n.m?'done':'future';}
function surf(c){return c.charAt(0)==='芝'?'t':'d';}
function gradeOf(g){return GRADES[g]?g:'';}
function shortName(r){var g=gradeOf(r.grade);var n=r.cls.replace(/\*$/,'');if(g&&n.slice(-g.length)===g)n=n.slice(0,-g.length);return n;}
function venuesOf(day){var v=[];day.races.forEach(function(r){if(v.indexOf(r.venue)<0)v.push(r.venue);});return v;}

  if((m=h.match(/^d-(\d{6})-([a-z]+)$/)))return{v:'hub',d:m[1],ven:KANJI[m[2]]};
  if(h==='menu')return{v:'menu'};

  return{v:'hub'};}

function parseHorse(x){if(x._p)return x._p;var d=toDom(x.block),t=T(d),p={};var m;
  if((m=t.match(/指数\s*([\d.]+)/)))p.idx=+m[1];

  if((m=t.match(/Mid AF\s*(-?[\d.]+)%\(最大AF\s*(-?[\d.]+)%・([^)]+)\)/))){p.mid=+m[1];p.max=+m[2];p.maxAt=m[3].split('・').join(' ');}

  if((m=t.match(/差し|先行|逃げ|追込/))){}
  if((m=t.match(/(逃げ|先行|差し|追込)(\(副:(逃げ|先行|差し|追込)\))?/))){p.style=m[1];p.style2=m[3]||'';}

  p.rows=[];d.querySelectorAll('table tr').forEach(function(tr,i){var td=tr.querySelectorAll('td');if(i===0||td.length<4)return;var nm=T(td[0]);var sub=/^└/.test(nm);
    var r={name:LBL[nm.replace(/^└\s*/,'')]||nm.replace(/^└\s*/,''),key:nm,raw:parseFloat(T(td[1])),w:T(td[2]),c:parseFloat(T(td[3]))};

function fieldStats(race){if(race._fs)return race._fs;var fs={idx:[],el:{}};race.horses.forEach(function(h){var p=parseHorse(h);if(p.idx!=null)fs.idx.push(p.idx);
  p.rows.forEach(function(r){(fs.el[r.key]=fs.el[r.key]||[]).push(r.c);});});race._fs=fs;return fs;}
function rankIn(arr,v){var s=arr.slice().sort(function(a,b){return b-a;});return s.indexOf(v)+1;}
function hTile(k,v,s,hi){return '<div class="tile'+(hi?' hi':'')+'"><div class="tk">'+k+'</div><div class="tv">'+v+'</div><div class="ts">'+(s||'&nbsp;')+'</div></div>';}
function stripSvg(vals,v){if(!vals.length)return'';var mn=Math.min.apply(null,vals),mx=Math.max.apply(null,vals),W=300,pad=10;var X=function(a){return mx===mn?W/2:pad+(a-mn)/(mx-mn)*(W-2*pad);};
  return '<svg class="strip-svg" viewBox="0 0 '+W+' 34" role="img" aria-label="出走馬の指数の分布"><line x1="'+pad+'" y1="14" x2="'+(W-pad)+'" y2="14" stroke="#ddd8cf" stroke-width="2"/>'+
   vals.map(function(a){return '<circle cx="'+X(a).toFixed(1)+'" cy="14" r="4" fill="#c9c2b6"/>';}).join('')+
   '<circle cx="'+X(v).toFixed(1)+'" cy="14" r="7" fill="#e85d00" stroke="#fff" stroke-width="2"/>'+
   '<text x="'+pad+'" y="32" font-size="10" fill="#6f685e">'+mn.toFixed(1)+'</text><text x="'+(W-pad)+'" y="32" font-size="10" fill="#6f685e" text-anchor="end">'+mx.toFixed(1)+'</text></svg>';}
function runsSvg(runs){var rs=runs.slice().reverse().map(function(r){var v=parseFloat(r.cp);return {v:v,fin:r.fin,when:r.when,race:r.race};}).filter(function(r){return !isNaN(r.v);});if(rs.length<2)return'';
  var W=320,H=196,L=36,R=26,T0=28,B=76;
  var vs=rs.map(function(r){return r.v;});var lo=Math.floor((Math.min.apply(null,vs)-2)/5)*5,hi=Math.ceil((Math.max.apply(null,vs)+2)/5)*5;
  var step=(hi-lo)>20?10:5,ys=[];for(var y=lo;y<=hi;y+=step)ys.push(y);
  var Y=function(v){return T0+(hi-v)/(hi-lo)*(H-T0-B);};
  var X=function(i){return L+18+(rs.length===1?0:i/(rs.length-1))*(W-L-R-18);};
  var g=ys.map(function(y){return '<line x1="'+L+'" x2="'+(W-R)+'" y1="'+Y(y).toFixed(1)+'" y2="'+Y(y).toFixed(1)+'" stroke="#eee9e1"/><text x="'+(L-5)+'" y="'+(Y(y)+3).toFixed(1)+'" font-size="9" fill="#8a8378" text-anchor="end">'+y+'</text>';}).join('');
  var pts=rs.map(function(r,i){return X(i).toFixed(1)+','+Y(r.v).toFixed(1);}).join(' ');
  var medal={1:'#d4a017',2:'#a9b0b8',3:'#b87333'};var best=Math.max.apply(null,vs);
  var dots=rs.map(function(r,i){var c=r.v===best?'#e85d00':'#2f63b0';
    return '<circle cx="'+X(i).toFixed(1)+'" cy="'+Y(r.v).toFixed(1)+'" r="6" fill="'+c+'" stroke="#fff" stroke-width="2"/>'+
      '<text x="'+X(i).toFixed(1)+'" y="'+(Y(r.v)-10).toFixed(1)+'" font-size="10" font-weight="700" fill="#16130f" text-anchor="middle">'+r.v.toFixed(1)+'</text>'+
      '<rect x="'+(X(i)-15).toFixed(1)+'" y="'+(H-B+8)+'" width="30" height="18" rx="4" fill="'+(medal[r.fin]||'#f0eee9')+'"/>'+
      '<text x="'+X(i).toFixed(1)+'" y="'+(H-B+21)+'" font-size="11" font-weight="800" fill="'+(medal[r.fin]?'#fff':'#4c463e')+'" text-anchor="middle">'+(r.fin?r.fin+'着':'-')+'</text>'+
      '<text x="'+X(i).toFixed(1)+'" y="'+(H-B+39)+'" font-size="9.5" font-weight="700" fill="#16130f" text-anchor="middle">'+esc(r.race.slice(0,6))+'</text>'+'<text x="'+X(i).toFixed(1)+'" y="'+(H-B+52)+'" font-size="9" fill="#4c463e" text-anchor="middle">'+esc((r.when.split(' ')[1]||'').replace(/m$/,''))+'</text>'+'<text x="'+X(i).toFixed(1)+'" y="'+(H-2)+'" font-size="9" fill="#8a8378" text-anchor="middle">'+r.when.slice(2,10).replace(/\//g,'.')+'</text>';}).join('');
  return '<svg class="runs-svg" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="過去走のAF(CP)の推移"><text x="'+L+'" y="10" font-size="9" fill="#8a8378">AF(CP)（上ほど良い・オレンジが最高）</text>'+g+
    '<polyline points="'+pts+'" fill="none" stroke="#2f63b0" stroke-width="2"/>'+dots+'</svg>';}
function openHorse(race,x){
  var p=parseHorse(x),fs=fieldStats(race),n=race.horses.length;var my=myMark(race,x).replace('〇','○');var w=WAKU[x.waku]||['#eee','#111'];
  var h='<div class="mkrow">'+MKS.concat(['×']).map(function(m){return '<button data-m="'+m+'" class="'+(m===my?'on':'')+'">'+m+'</button>';}).join('')+'</div>';
  h+='<div class="hz pad"><div class="hz-id"><span class="hz-no" style="background:'+w[0]+';color:'+w[1]+'">'+x.no+'</span><div><div class="hz-meta">'+[x.sa,x.jockey,x.kin+'kg',p.style?p.style+(p.style2?'(副:'+p.style2+')':''):''].filter(Boolean).map(function(v){return '<span>'+esc(v)+'</span>';}).join('')+'</div>'+
     (x.auto?'<div class="hz-auto">自動予想の印 <b>'+x.auto+'</b></div>':'')+'</div><div class="hz-od"><b>'+(x.odds||'-')+'</b><small>'+(x.ninki?x.ninki+'人気':'オッズ未発表')+'</small></div></div>';
  h+='<div class="tiles">'+hTile('指数',p.idx!=null?p.idx.toFixed(1):'-',x.rank+'位 / '+n+'頭',x.rank===1)+
     hTile('fit補正後',x.fit!=null?x.fit+'位':'-',x.fit!=null?(p.fitMove||''):'芝のみ',x.fit===1)+
     hTile('S複勝率',x.s!=null?x.s+'%':'-',x.srank?x.srank+'位 / '+n+'頭':'',x.srank===1)+'</div>';
  if(p.idx!=null)h+='<div class="cap2">出走馬の指数の分布（オレンジがこの馬）</div>'+stripSvg(fs.idx,p.idx);
  if(p.mid!=null)h+='<div class="afrow"><div><span>Mid AF</span><b>'+p.mid+'%</b></div><div><span>最大AF</span><b>'+p.max+'%</b><small>'+esc(p.maxAt||'')+'</small></div><div><span>Mid AF(CP)</span><b>'+(p.cp!=null?p.cp:'-')+'</b></div></div>';
  if(p.rows.length){h+='<h4 class="hh">指数の内訳 <small>寄与度と、出走馬の中での順位</small></h4><div class="bdv">';
    var rows=p.rows.slice().sort(function(a,b){return Math.abs(b.c)-Math.abs(a.c);});
    rows.forEach(function(r){var arr=fs.el[r.key]||[r.c];var mn=Math.min.apply(null,arr),mx=Math.max.apply(null,arr);var rel=mx===mn?1:(r.c-mn)/(mx-mn);var rk=rankIn(arr,r.c);
      var cls=rk<=3?'bk-top':rk>arr.length-3?'bk-low':'';
      h+='<div class="bdr '+cls+'"><div class="bdn">'+esc(r.name)+'<small>'+r.c.toFixed(1)+'（'+r.raw+' '+esc(r.w)+'）</small></div><div class="bdb"><i style="width:'+Math.max(4,rel*100).toFixed(0)+'%"></i></div><div class="bdk">'+rk+'<small>/'+arr.length+'</small></div></div>';
      if(r.subs)h+='<div class="bds">'+r.subs.map(function(s){return '<span>'+esc(s.name)+' '+s.c.toFixed(1)+'</span>';}).join('')+'</div>';});
    h+='</div>';}
  if(p.runs.length){h+='<h4 class="hh">過去走 <small>AF(CP)と着順の推移（古い→新しい）</small></h4>'+runsSvg(p.runs);}
  h+='<a class="info" href="#notes-horse">ⓘ この画面の数値の説明</a></div>';
  if(p.runs.length)h+='<div class="runs-raw">'+p.runs.map(function(r){return r.html;}).join('')+'</div>';
  if(p.blood)h+='<div class="blood pad">'+p.blood.map(esc).join(' ／ ')+'</div>';
  h+='<a class="ext" href="'+SITE+'horse.html?name='+encodeURIComponent(x.name)+'">'+esc(x.name)+'の全成績を開く ›</a>';
  openSheet(x.no+' '+x.name,h);
  var b=document.getElementById('shBody');
  b.querySelectorAll('.mkrow button').forEach(function(btn){btn.onclick=function(){var m=btn.dataset.m==='×'?'':btn.dataset.m;setMark(race,x,m==='○'?'〇':m);
    b.querySelectorAll('.mkrow button').forEach(function(z){z.classList.toggle('on',z===btn&&!!m);});drawRows(race);};});
}
