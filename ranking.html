<html><head><meta charset="utf-8"><meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1"><link rel="apple-touch-icon" href="apple-touch-icon.png"><link rel="icon" type="image/png" sizes="192x192" href="icon-192.png"><link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png"><link rel="manifest" href="manifest.json"><meta name="theme-color" content="#ff6600">
<style>
  body { font-family: sans-serif; background:#f5f5f5; margin:0; padding:12px; max-width:520px; margin-left:auto; margin-right:auto; box-sizing:border-box; }
  .period-row { display:flex; gap:8px; margin-bottom:16px; }
  .period-btn { flex:1; padding:8px; border:2px solid #111; background:#fff; color:#111; border-radius:6px; font-size:13px; font-weight:bold; }
  .period-btn.active { background:#111; color:#fff; }
  .venue-header { background:#111; color:#fff; padding:8px 12px; border-radius:6px 6px 0 0; font-weight:bold; font-size:14px; margin-top:14px; }
  .badge-row { display:flex; flex-wrap:wrap; gap:6px; padding:10px; background:#fff; border:1px solid #ddd; border-top:none; border-radius:0 0 6px 6px; }
  .badge { padding:6px 10px; border-radius:6px; font-size:12px; border:none; color:#333; }
  .badge.turf { background:#e8f5e9; color:#4a7a4f; }
  .badge.dirt { background:#f5ebe0; color:#8a6d4d; }
  .badge:disabled { background:#ccc; color:#888; }
  #rankingResult { margin-top:20px; }
  .rank-row { background:#fff; border:1px solid #ddd; border-radius:6px; padding:8px 10px; margin-bottom:6px; font-size:13px; display:flex; justify-content:space-between; }
  .rank-row a { color:#0645AD; text-decoration:none; font-weight:bold; }
  .loading { color:#888; font-size:14px; padding:20px 0; text-align:center; }
  h2 { font-size:16px; margin:16px 0 8px; }
  h3 { font-size:15px; margin:0 0 10px; }
</style>
</head><body><div id="top" style="background:#000; margin:-12px -12px 0 -12px; padding:14px 16px; border-bottom:3px solid #ff6600; display:flex; justify-content:space-between; align-items:center; font-family:sans-serif;">
<a href="index.html" style="color:#fff; font-weight:bold; font-size:17px; letter-spacing:0.5px; text-decoration:none;">AF<span style="color:#ff6600;">Keiba</span>DATA</a>
<div style="display:flex; gap:14px; align-items:center;">
<a id="value-link-icon" href="index.html#value-ranking" style="color:#ff6600; text-decoration:none; font-size:16px;" title="本日の狙い目">🎯</a>
<a id="confidence-link-icon" href="index.html#confidence-ranking" style="color:#ff6600; text-decoration:none; font-size:16px;" title="堅軸TOP10">🔥</a>
<a href="ranking.html" style="color:#ddd; text-decoration:none; font-size:16px;" title="ランキング">🏆</a>
<a href="calendar.html" style="color:#ddd; text-decoration:none; font-size:16px;" title="カレンダー">📅</a>
<a href="horse.html" style="color:#ddd; text-decoration:none; font-size:16px;" title="馬名検索">🔍</a>
<a href="review.html" style="color:#ddd; text-decoration:none; font-size:16px;" title="予想の振り返り">📊</a>
</div>
</div>
<div style="height:14px;"></div>
<script>
(function() {
  const d = new Date();
  const yy = String(d.getFullYear()).slice(2);
  const mm = String(d.getMonth() + 1).padStart(2, '0');
  const dd = String(d.getDate()).padStart(2, '0');
  const todayFile = 'dashboard_' + yy + mm + dd + '.html';
  fetch(todayFile, { method: 'HEAD' }).then(res => {
    if (res.ok) {
      const vLink = document.getElementById('value-link-icon');
      const cLink = document.getElementById('confidence-link-icon');
      if (vLink) vLink.href = todayFile + '#value-ranking';
      if (cLink) cLink.href = todayFile + '#confidence-ranking';
    }
  }).catch(() => {});
})();
</script>
<h2 id="venue-ranking">🏆 会場別AFランキング</h2>
<a href="#total-ranking" style="font-size:12px; color:#0645AD;">▼ 総合力ランキングへ移動</a>
<div class="period-row">
  <button class="period-btn active" id="btn-all" onclick="changePeriod('all')">全期間</button>
  <button class="period-btn" id="btn-3y" onclick="changePeriod('3y')">直近3年</button>
  <button class="period-btn" id="btn-1y" onclick="changePeriod('1y')">直近1年</button>
</div>
<div id="grid"><div class="loading">読み込み中…</div></div>
<div id="rankingResult"></div>

<h2 id="total-ranking" style="margin-top:28px;">💯 総合力ランキングTop100</h2>
<a href="#venue-ranking" style="font-size:12px; color:#0645AD;">▲ 会場別ランキングへ戻る</a>
<p style="font-size:12px; color:#666; margin-top:4px;">走破スタイル・レーダーチャート(5項目合計・ベスト距離帯基準)の全馬順位です。会場・距離を問わず、距離を横断した総合力の高さを示します。</p>
<div class="period-row" id="surfaceTabRow">
  <button class="period-btn active" data-surface="turf" onclick="changeSurfaceTab('turf')">芝</button>
  <button class="period-btn" data-surface="dirt" onclick="changeSurfaceTab('dirt')">ダート</button>
</div>
<div class="period-row" id="bucketTabRow">
  <button class="period-btn active" data-bucket="all" onclick="changeBucketTab('all')">全体</button>
</div>
<div id="totalRankingResult"><div class="loading">読み込み中…</div></div>

<script>
let rankingData = null;
let cellIndex = {};
let currentPeriod = 'all';
let totalTop100Data = null;
let bucketRankingData = null;
let totalTop100DataDirt = null;
let bucketRankingDataDirt = null;
let currentBucketTab = 'all';
let currentSurfaceTab = 'turf';

fetch('af_ranking.json').then(r => r.json()).then(data => {
  rankingData = data;
  const allKeys = new Set();
  Object.values(data).forEach(periodObj => Object.keys(periodObj).forEach(k => allKeys.add(k)));
  allKeys.forEach(k => {
    const parts = k.split('_');
    const distance = parts.pop();
    const surface = parts.pop();
    const venue = parts.join('_');
    if (!cellIndex[venue]) cellIndex[venue] = [];
    cellIndex[venue].push({surface: surface, distance: parseInt(distance), key: k});
  });
  // 2026/7/23確定(成果153、TAISUKE提案): 芝を先頭・ダートを後、距離は短い順に
  // 明示的に並べる(以前は文字コード比較により、意図せずダートが先頭に来ていた)
  const surfaceOrder = { '芝': 0, 'ダート': 1 };
  Object.keys(cellIndex).forEach(v => cellIndex[v].sort((a,b) => (surfaceOrder[a.surface] - surfaceOrder[b.surface]) || a.distance - b.distance));
  renderGrid();
});

function renderTotalRankingList(entries, showBucket) {
  let html = '';
  entries.forEach(e => {
    const bucketLine = showBucket ? ('得意: ' + e.bestBucket) : '';
    html += '<div class="rank-row" style="flex-direction:column; align-items:flex-start;">' +
            '<div style="display:flex; justify-content:space-between; width:100%;"><span>' + e.rank + '位 <a href="horse.html?name=' + encodeURIComponent(e.name) + '">' + e.name + '</a></span><span>総合力 ' + e.total + '</span></div>' +
            (bucketLine ? '<div style="font-size:11px; color:#888; margin-top:2px;">' + bucketLine + '</div>' : '') +
            '</div>';
  });
  document.getElementById('totalRankingResult').innerHTML = html || '<div class="loading">データがまだありません</div>';
}

// 2026/7/23確定(成果117、TAISUKE提案): 芝・ダート切り替えタブを新設
function changeSurfaceTab(surfaceKey) {
  currentSurfaceTab = surfaceKey;
  document.querySelectorAll('#surfaceTabRow .period-btn').forEach(b => b.classList.remove('active'));
  document.querySelector('#surfaceTabRow [data-surface="' + surfaceKey + '"]').classList.add('active');
  rebuildBucketTabs();
  changeBucketTab('all');
}

function rebuildBucketTabs() {
  const tabRow = document.getElementById('bucketTabRow');
  tabRow.innerHTML = '<button class="period-btn active" data-bucket="all" onclick="changeBucketTab(\'all\')">全体</button>';
  const bucketData = currentSurfaceTab === 'dirt' ? bucketRankingDataDirt : bucketRankingData;
  if (!bucketData) return;
  Object.keys(bucketData).forEach(bucketKey => {
    const btn = document.createElement('button');
    btn.className = 'period-btn';
    btn.dataset.bucket = bucketKey;
    btn.textContent = bucketKey;
    btn.onclick = function() { changeBucketTab(bucketKey); };
    tabRow.appendChild(btn);
  });
}

function changeBucketTab(bucketKey) {
  currentBucketTab = bucketKey;
  document.querySelectorAll('#bucketTabRow .period-btn').forEach(b => b.classList.remove('active'));
  const targetBtn = document.querySelector('#bucketTabRow [data-bucket="' + CSS.escape(bucketKey) + '"]');
  if (targetBtn) targetBtn.classList.add('active');
  const totalData = currentSurfaceTab === 'dirt' ? totalTop100DataDirt : totalTop100Data;
  const bucketData = currentSurfaceTab === 'dirt' ? bucketRankingDataDirt : bucketRankingData;
  if (bucketKey === 'all') {
    renderTotalRankingList(totalData || [], true);
  } else {
    renderTotalRankingList((bucketData && bucketData[bucketKey]) || [], false);
  }
}

fetch('total_ranking_top100.json').then(r => r.json()).then(data => {
  totalTop100Data = data;
  if (currentSurfaceTab === 'turf' && currentBucketTab === 'all') renderTotalRankingList(data, true);
}).catch(() => {
  document.getElementById('totalRankingResult').innerHTML = '<div class="loading">データがまだありません</div>';
});

fetch('bucket_total_ranking.json').then(r => r.json()).then(data => {
  bucketRankingData = data;
  if (currentSurfaceTab === 'turf') rebuildBucketTabs();
}).catch(() => {});

fetch('total_ranking_top100_dirt.json').then(r => r.json()).then(data => {
  totalTop100DataDirt = data;
}).catch(() => {});

fetch('bucket_total_ranking_dirt.json').then(r => r.json()).then(data => {
  bucketRankingDataDirt = data;
}).catch(() => {});


function renderGrid() {
  let html = '';
  Object.keys(cellIndex).sort().forEach(venue => {
    html += '<div class="venue-header">' + venue + '</div>';
    // 2026/7/23確定(成果160、TAISUKE提案): 「(芝)」「(ダート)」の表記が、
    // ボタンごとに何度も繰り返され、見づらいとの指摘を受け、芝・ダートで
    // グループ化し、見出しを1回だけ表示する形式に整理した
    ['芝', 'ダート'].forEach(surfaceGroup => {
      const items = cellIndex[venue].filter(c => c.surface === surfaceGroup);
      if (items.length === 0) return;
      html += '<div style="font-size:11px; color:#999; margin:4px 0 2px 2px;">' + surfaceGroup + '</div><div class="badge-row">';
      items.forEach(c => {
        const hasData = rankingData[currentPeriod] && rankingData[currentPeriod][c.key] && rankingData[currentPeriod][c.key].length > 0;
        const label = c.distance + 'm';
        const cls = 'badge ' + (c.surface === '芝' ? 'turf' : 'dirt');
        if (hasData) {
          html += '<button class="' + cls + '" onclick="showRanking(\'' + c.key + '\')">' + label + '</button>';
        } else {
          html += '<button class="' + cls + '" disabled>' + label + '</button>';
        }
      });
      html += '</div>';
    });
  });
  document.getElementById('grid').innerHTML = html;
}

function showRanking(key) {
  const entries = rankingData[currentPeriod][key];
  const parts = key.split('_');
  const distance = parts.pop();
  const surface = parts.pop();
  const venue = parts.join('_');
  let html = '<h3>' + venue + ' ' + distance + 'm(' + surface + ') AFランキング</h3>';
  entries.forEach((e, i) => {
    const name = e[0], af = e[1], date = e[2], raceName = e[3], dashLink = e[4], archiveLink = e[5], rNum = e[6];
    let raceNameDisplay = raceName || '-';
    if (archiveLink) {
      raceNameDisplay = '<a href="race.html?key=' + archiveLink + '">' + raceNameDisplay + '</a>';
    } else if (dashLink && rNum) {
      raceNameDisplay = '<a href="dashboard_' + dashLink + '.html#' + venue + '_' + rNum + '">' + raceNameDisplay + '</a>';
    }
    html += '<div class="rank-row" style="flex-direction:column; align-items:flex-start;">' +
            '<div style="display:flex; justify-content:space-between; width:100%;"><span>' + (i+1) + '位 <a href="horse.html?name=' + encodeURIComponent(name) + '">' + name + '</a></span><span>AF ' + af.toFixed(2) + '%</span></div>' +
            '<div style="font-size:11px; color:#888; margin-top:2px;">' + date + ' ' + raceNameDisplay + '</div>' +
            '</div>';
  });
  document.getElementById('rankingResult').innerHTML = html;
  document.getElementById('rankingResult').scrollIntoView({behavior:'smooth'});
}

function changePeriod(p) {
  currentPeriod = p;
  document.querySelectorAll('.period-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('btn-' + p).classList.add('active');
  renderGrid();
  document.getElementById('rankingResult').innerHTML = '';
}
</script>
</body></html>
