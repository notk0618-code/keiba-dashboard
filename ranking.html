<html><head><meta charset="utf-8"><meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1"><link rel="apple-touch-icon" href="apple-touch-icon.png"><link rel="icon" type="image/png" sizes="192x192" href="icon-192.png"><link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png"><link rel="manifest" href="manifest.json"><meta name="theme-color" content="#ff6600">
<title>コース別AFランキング</title>
<style>
  :root { --bg:#f5f5f5; --panel:#fff; --fg:#1d2420; --muted:#6b736e; --line:#e2e5e2;
          --turf:#3f7a4f; --turf-soft:#e8f2ea; --dirt:#8a6d4d; --dirt-soft:#f5ece2; --accent:#ff6600;
          --g1:#7a2e8f; --g2:#b2412e; --g3:#2a5fa8; --op:#4e6b5c; }
  body { font-family: "Hiragino Sans","Noto Sans JP",sans-serif; background:var(--bg); color:var(--fg); margin:0; padding:12px; max-width:520px; margin-left:auto; margin-right:auto; box-sizing:border-box; }
  h2 { font-size:17px; margin:16px 0 4px; }
  .note { font-size:12px; color:var(--muted); margin:0 0 10px; }
  .panel { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:12px; margin-bottom:12px; }
  .seg { display:flex; gap:0; border:1.5px solid #111; border-radius:8px; overflow:hidden; margin-bottom:10px; }
  .seg button { flex:1; padding:8px 4px; border:none; background:#fff; color:#111; font-size:13px; font-weight:bold; cursor:pointer; }
  .seg button + button { border-left:1.5px solid #111; }
  .seg button.on { background:#111; color:#fff; }
  .chips { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:10px; }
  .chip { font:inherit; font-size:13px; border:1px solid #cfd5d0; background:#fff; color:var(--fg); border-radius:999px; padding:5px 13px; cursor:pointer; }
  .chip.on { background:var(--surf); border-color:var(--surf); color:#fff; font-weight:bold; }
  .chip:disabled { color:#bbb; border-color:#e5e5e5; cursor:default; }
  .chip:focus-visible, .seg button:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  .ctitle { font-size:16px; font-weight:bold; margin:0 0 2px; }
  .sub { font-size:12px; color:var(--muted); }
  .stack { display:flex; height:14px; border-radius:4px; overflow:hidden; margin:8px 0 4px; background:#eee; }
  .stack span { display:block; height:100%; }
  .legend { display:flex; flex-wrap:wrap; gap:4px 10px; font-size:11px; color:var(--muted); }
  .legend i { display:inline-block; width:9px; height:9px; border-radius:2px; margin-right:3px; vertical-align:-1px; }
  .kv { display:flex; gap:14px; flex-wrap:wrap; font-size:12px; margin-top:8px; }
  .kv b { font-variant-numeric:tabular-nums; }
  .row { display:grid; grid-template-columns:30px 1fr auto; gap:2px 8px; align-items:center; padding:9px 2px; border-bottom:1px solid var(--line); }
  .row:last-child { border-bottom:none; }
  .rk { font-size:15px; font-weight:bold; text-align:right; font-variant-numeric:tabular-nums; color:#333; }
  .rk.top { color:var(--accent); }
  .nm { min-width:0; }
  .nm a.h { color:#0645AD; text-decoration:none; font-weight:bold; font-size:14px; }
  .meta { font-size:11px; color:var(--muted); margin-top:2px; overflow-wrap:anywhere; }
  .meta a { color:#0645AD; text-decoration:none; }
  .af { text-align:right; font-size:14px; font-weight:bold; font-variant-numeric:tabular-nums; }
  .bar { grid-column:2 / 4; height:5px; background:#eef0ee; border-radius:3px; overflow:hidden; }
  .bar span { display:block; height:100%; background:var(--surf); border-radius:3px; }
  .cls { display:inline-block; min-width:2.6em; text-align:center; font-size:10px; font-weight:bold; border:1px solid currentColor; border-radius:3px; padding:0 3px; margin-right:4px; color:#888; }
  .c-G1{color:var(--g1)} .c-G2{color:var(--g2)} .c-G3{color:var(--g3)} .c-L,.c-OP{color:var(--op)}
  .tag { display:inline-block; font-size:10px; background:#f0f1f0; color:#555; border-radius:3px; padding:0 4px; margin-left:3px; }
  .tag.wet { background:#e3ecf7; color:#2a5fa8; }
  .loading { color:#888; font-size:14px; padding:20px 0; text-align:center; }
</style>
</head><body><div id="top" style="background:#000; margin:-12px -12px 0 -12px; padding:14px 16px; border-bottom:3px solid #ff6600; display:flex; justify-content:space-between; align-items:center; font-family:sans-serif;">
<a href="index.html" style="color:#fff; font-weight:bold; font-size:17px; letter-spacing:0.5px; text-decoration:none;">AF<span style="color:#ff6600;">Keiba</span>DATA</a>
<div style="display:flex; gap:14px; align-items:center;">
<a id="value-link-icon" href="index.html#value-ranking" style="color:#ff6600; text-decoration:none; font-size:16px;" title="本日の狙い目">🎯</a>
<a id="confidence-link-icon" href="index.html#confidence-ranking" style="color:#ff6600; text-decoration:none; font-size:16px;" title="堅軸TOP10">🔥</a>
<a id="bets-link-icon" href="bets.html" style="color:#ff6600; text-decoration:none; font-size:16px;" title="買い目リスト">🎫</a>
<a href="ranking.html" style="color:#ddd; text-decoration:none; font-size:16px;" title="ランキング">🏆</a>
<a href="calendar.html" style="color:#ddd; text-decoration:none; font-size:16px;" title="カレンダー">📅</a>
<a href="horse.html" style="color:#ddd; text-decoration:none; font-size:16px;" title="馬名・レース検索">🔍</a>
<a href="review.html" style="color:#ddd; text-decoration:none; font-size:16px;" title="予想の振り返り">📊</a>
</div>
</div>
<div style="height:14px;"></div>
<script>
(function() {
  const d = new Date();
  const yy = String(d.getFullYear()).slice(2);
  const mm = String(d.getMonth() + 1).padStart(2, '0');
  const dd = String(d.getDate()).padStart(2, '0');
  const todayFile = 'dashboard_' + yy + mm + dd + '.html';
  fetch(todayFile, { method: 'HEAD' }).then(res => {
    if (res.ok) {
      const vLink = document.getElementById('value-link-icon');
      const cLink = document.getElementById('confidence-link-icon');
      if (vLink) vLink.href = todayFile + '#value-ranking';
      if (cLink) cLink.href = todayFile + '#confidence-ranking';
    }
  }).catch(() => {});
})();
</script>
<h2>🏆 コース別AFランキング</h2>
<p class="note">各コースのAF上位30走です。AFはマイナスほど速い評価です。</p>

<div class="seg" id="periodSeg" role="group" aria-label="期間">
  <button type="button" data-p="all" class="on">全期間</button>
  <button type="button" data-p="3y">直近3年</button>
  <button type="button" data-p="1y">直近1年</button>
</div>
<div class="seg" id="surfSeg" role="group" aria-label="芝・ダート">
  <button type="button" data-s="芝" class="on">芝</button>
  <button type="button" data-s="ダート">ダート</button>
</div>
<div class="chips" id="venueChips" role="group" aria-label="会場"></div>
<div class="chips" id="distChips" role="group" aria-label="距離"></div>

<div class="panel" id="summary"><div class="loading">読み込み中…</div></div>
<div class="panel" id="list"></div>

<script>
let R = null, idx = {};
let st = { p:'all', s:'芝', v:null, d:null };
try { const sv = JSON.parse(localStorage.getItem('rankSel') || 'null'); if (sv) st = Object.assign(st, sv); } catch (e) {}
const VORDER = ['札幌','函館','福島','新潟','東京','中山','中京','京都','阪神','小倉'];
const CLS = ['G1','G2','G3','L','OP','3勝','2勝','1勝','未勝利','新馬'];
const CCOL = {'G1':'#7a2e8f','G2':'#b2412e','G3':'#2a5fa8','L':'#4e6b5c','OP':'#7d9a8a','3勝':'#a3a8a4','2勝':'#bcc0bd','1勝':'#d2d5d3','未勝利':'#e2e4e2','新馬':'#ececec'};
const esc = t => String(t == null ? '' : t).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

fetch('af_ranking.json').then(r => r.json()).then(data => {
  R = data;
  Object.values(data).forEach(po => Object.keys(po).forEach(k => {
    const parts = k.split('_'); const dist = parseInt(parts.pop()); const surf = parts.pop(); const venue = parts.join('_');
    idx[surf] = idx[surf] || {}; idx[surf][venue] = idx[surf][venue] || new Set(); idx[surf][venue].add(dist);
  }));
  render();
});

function venues() { const vs = Object.keys(idx[st.s] || {}); return vs.sort((a,b) => (VORDER.indexOf(a)+99*(VORDER.indexOf(a)<0)) - (VORDER.indexOf(b)+99*(VORDER.indexOf(b)<0))); }
function dists() { return [...((idx[st.s] || {})[st.v] || [])].sort((a,b) => a-b); }
function key() { return st.v + '_' + st.s + '_' + st.d; }
function entries() { return ((R[st.p] || {})[key()]) || []; }
function save() { try { localStorage.setItem('rankSel', JSON.stringify(st)); } catch (e) {} }

function render() {
  if (!R) return;
  document.body.style.setProperty('--surf', st.s === '芝' ? 'var(--turf)' : 'var(--dirt)');
  document.querySelectorAll('#periodSeg button').forEach(b => b.classList.toggle('on', b.dataset.p === st.p));
  document.querySelectorAll('#surfSeg button').forEach(b => b.classList.toggle('on', b.dataset.s === st.s));
  const vs = venues(); if (!vs.includes(st.v)) st.v = vs.includes('東京') ? '東京' : vs[0];
  const ds = dists(); if (!ds.includes(st.d)) st.d = ds[0];
  const vc = document.getElementById('venueChips'); vc.innerHTML = '';
  vs.forEach(v => { const b = document.createElement('button'); b.type='button'; b.className = 'chip' + (v === st.v ? ' on' : ''); b.textContent = v; b.onclick = () => { st.v = v; render(); }; vc.appendChild(b); });
  const dc = document.getElementById('distChips'); dc.innerHTML = '';
  ds.forEach(d => { const b = document.createElement('button'); b.type='button'; b.className = 'chip' + (d === st.d ? ' on' : ''); b.textContent = d + 'm';
    const has = ((R[st.p] || {})[st.v + '_' + st.s + '_' + d] || []).length > 0; b.disabled = !has;
    b.onclick = () => { st.d = d; render(); }; dc.appendChild(b); });
  save(); renderSummary(); renderList();
}

function renderSummary() {
  const es = entries(); const el = document.getElementById('summary');
  const pl = {all:'全期間', '3y':'直近3年', '1y':'直近1年'}[st.p];
  if (!es.length) { el.innerHTML = '<div class="ctitle">' + esc(st.v) + esc(st.s) + st.d + 'm</div><div class="sub">' + pl + 'のデータがありません</div>'; return; }
  const cnt = {}; es.forEach(e => { const c = e[11] || '不明'; cnt[c] = (cnt[c] || 0) + 1; });
  let bar = '', leg = '';
  CLS.concat(['不明']).forEach(c => { if (!cnt[c]) return; const w = cnt[c] / es.length * 100;
    bar += '<span style="width:' + w + '%;background:' + (CCOL[c] || '#ddd') + '" title="' + c + ' ' + cnt[c] + '走"></span>';
    leg += '<span><i style="background:' + (CCOL[c] || '#ddd') + '"></i>' + c + ' ' + cnt[c] + '</span>'; });
  const tk = {}; es.forEach(e => { const t = e[8] || '-'; tk[t] = (tk[t] || 0) + 1; });
  const tkStr = ['良','稍','重','不'].filter(t => tk[t]).map(t => t + ' ' + tk[t]).join(' / ');
  const wins = es.filter(e => String(e[7]) === '1').length;
  el.innerHTML = '<div class="ctitle">' + esc(st.v) + esc(st.s) + st.d + 'm</div>' +
    '<div class="sub">' + pl + '・上位' + es.length + '走のクラス構成</div>' +
    '<div class="stack">' + bar + '</div><div class="legend">' + leg + '</div>' +
    '<div class="kv"><span>1位 AF <b>' + es[0][1].toFixed(2) + '</b></span><span>' + es.length + '位 AF <b>' + es[es.length-1][1].toFixed(2) + '</b></span>' +
    '<span>勝ち馬 <b>' + wins + '</b>走</span><span>馬場 ' + (tkStr || '-') + '</span></div>';
}

function renderList() {
  const es = entries(); const el = document.getElementById('list');
  if (!es.length) { el.innerHTML = ''; return; }
  const best = es[0][1], worst = es[es.length-1][1], span = Math.max(worst - best, 0.01);
  let h = '';
  es.forEach((e, i) => {
    const name = e[0], af = e[1], date = e[2], raceName = e[3], dashLink = e[4], archiveLink = e[5], rNum = e[6];
    const fin = e[7], track = e[8], pace = e[9], style = e[10], cls = e[11];
    let race = esc(raceName || '-');
    if (archiveLink) race = '<a href="race.html?key=' + encodeURIComponent(archiveLink) + '">' + race + '</a>';
    else if (dashLink && rNum) race = '<a href="dashboard_' + dashLink + '.html#' + encodeURIComponent(st.v) + '_' + rNum + '">' + race + '</a>';
    const w = 20 + 80 * (worst - af) / span;
    const finTxt = (fin && fin !== '0') ? fin + '着' : '';
    const tags = (finTxt ? '<span class="tag">' + finTxt + '</span>' : '') +
                 (track ? '<span class="tag' + (track !== '良' ? ' wet' : '') + '">' + esc(track) + '</span>' : '') +
                 (pace ? '<span class="tag">' + esc(pace) + '</span>' : '') +
                 (style ? '<span class="tag">' + esc(style) + '</span>' : '');
    h += '<div class="row"><div class="rk' + (i < 3 ? ' top' : '') + '">' + (i+1) + '</div>' +
         '<div class="nm"><a class="h" href="horse.html?name=' + encodeURIComponent(name) + '">' + esc(name) + '</a>' +
         '<div class="meta">' + (cls ? '<span class="cls c-' + esc(cls) + '">' + esc(cls) + '</span>' : '') + esc(date) + ' ' + race + tags + '</div></div>' +
         '<div class="af">' + af.toFixed(2) + '</div>' +
         '<div class="bar"><span style="width:' + w.toFixed(1) + '%"></span></div></div>';
  });
  el.innerHTML = h;
}

document.querySelectorAll('#periodSeg button').forEach(b => b.onclick = () => { st.p = b.dataset.p; render(); });
document.querySelectorAll('#surfSeg button').forEach(b => b.onclick = () => { st.s = b.dataset.s; render(); });
</script>
</body></html>
