const venues = [...new Set(courseData.map(d => d.venue))];
let currentVenue = venues[0];

function renderTabs() {
  document.getElementById('venueTabs').innerHTML = venues.map(v =>
    `<span class="venue-tab ${v===currentVenue?'active':''}" onclick="selectVenue('${v}')">${v}</span>`
  ).join('');
}

function selectVenue(v) {
  currentVenue = v;
  renderTabs();
  renderCards();
}

function renderCards() {
  const items = courseData.filter(d => d.venue === currentVenue).sort((a,b) => a.surface.localeCompare(b.surface) || a.distance - b.distance);
  document.getElementById('courseCards').innerHTML = items.map(d => {
    const maxLap = Math.max(...d.lap_waveform);
    const minLap = Math.min(...d.lap_waveform);
    const bars = d.lap_waveform.map((v, i) => {
      const heightPct = 20 + (maxLap - v) / (maxLap - minLap + 0.01) * 80;
      return `<div class="lap-bar" style="height:${heightPct}%;" title="${i+1}F: ${v}秒"></div>`;
    }).join('');
    const posEntries = Object.entries(d.position_summary);
    const bestPos = posEntries.reduce((a,b) => a[1].複勝率 > b[1].複勝率 ? a : b)[0];
    const wakuEntries = Object.entries(d.waku_summary);
    const bestWaku = wakuEntries.reduce((a,b) => a[1].複勝率 > b[1].複勝率 ? a : b)[0];
    const shiftBadge = (d.low_class_optimal && d.high_class_optimal && d.low_class_optimal !== d.high_class_optimal)
      ? `<span class="shift-badge">クラスで、最適位置が変化</span>` : '';
    return `
      <div class="course-card">
        <div class="course-title">${d.venue}${d.surface}${d.distance}m ${shiftBadge}</div>
        <div class="lap-bar-container">${bars}</div>
        <div class="metric-row">仕掛けどころ: ラスト${d.kick_point_last_f}F付近 ／ 平均PCI: ${d.avg_pci} ／ サンプル数: ${d.n_races}</div>
        <div class="metric-row">4角、最適な位置取り: ${bestPos}${d.low_class_optimal ? ` (低クラス:${d.low_class_optimal} / 高クラス:${d.high_class_optimal})` : ''}</div>
        <div class="metric-row">有利な馬番: ${bestWaku}</div>
      </div>`;
  }).join('');
}

renderTabs();
renderCards();
