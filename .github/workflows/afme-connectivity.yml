# One-off check for the AF-ME forward test: can a GitHub-hosted runner reach JRA's official pages?
# Prints HTTP status codes and byte counts only (this log is public). Runs only on pushes to this work branch.
name: afme-connectivity
on:
  push:
    branches: [claude/project-thread-oxaol7]
    paths: [.github/workflows/afme-connectivity.yml]
permissions: { contents: read }
jobs:
  reach:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: JRA odds (top) and 馬場 pages
        run: |
          for i in 1 2 3; do
            curl -s -o /tmp/o.html -w "accessO top: HTTP %{http_code}, %{size_download} bytes, %{time_total}s\n" -X POST -d 'cname=pw15oli00/6D' https://www.jra.go.jp/JRADB/accessO.html || echo "accessO: curl failed"
            curl -s -o /tmp/b.html -w "keiba/baba: HTTP %{http_code}, %{size_download} bytes\n" -A 'Mozilla/5.0' https://www.jra.go.jp/keiba/baba/ || echo "baba: curl failed"
            sleep 2
          done
          grep -c "pw15orl" /tmp/o.html || true
