<a href="index.html" style="color:#fff; font-weight:bold; font-size:17px; letter-spacing:0.5px; text-decoration:none;">AF<span style="color:#ff6600;">Keiba</span>DATA</a>
<div style="display:flex; gap:14px; align-items:center;">

<script>
(function() {
  const d = new Date();
  const yy = String(d.getFullYear()).slice(2);
  const mm = String(d.getMonth() + 1).padStart(2, '0');
  const dd = String(d.getDate()).padStart(2, '0');
  const todayFile = 'dashboard_' + yy + mm + dd + '.html';
  fetch(todayFile, { method: 'HEAD' }).then(res => {
    if (res.ok) {
      const vLink = document.getElementById('value-link-icon');
      const cLink = document.getElementById('confidence-link-icon');
      if (vLink) vLink.href = todayFile + '#value-ranking';
      if (cLink) cLink.href = todayFile + '#confidence-ranking';
    }
  }).catch(() => {});
})();
</script>
<h2>🔍 馬名検索</h2>
<input type="text" id="searchBox" placeholder="馬名を入力(部分一致)" autocomplete="off">
<div id="resultsArea"></div>

<script>
let horseData = null;
let horseRatings = null;
let horseRatingsDirt = null;
let horseBestConditions = null;
let horseSexAge = null;
let horseExtraStats = null;
let loadingPromise = null;

function loadData() {
  if (loadingPromise) return loadingPromise;
  document.getElementById('resultsArea').innerHTML = '<div class="loading">データ読み込み中(初回のみ時間がかかります)…</div>';
  const dataPromise = fetch('horse_data.json').then(r => r.json());
  // 2026/7/23確定(成果132、TAISUKE提案): 2016-2020年分の取り込みにより
  // horse_data.jsonがGitHub APIのアップロード上限を超えたため、
  // 「直近版(horse_data.json)」と「過去版(horse_data_archive.json)」の
  // 2ファイルに分割した。両方を取得し、馬ごとにマージする
  const archiveDataPromise = fetch('horse_data_archive.json').then(r => r.json()).catch(() => ({}));
  const ratingsPromise = fetch('horse_ratings.json').then(r => r.json()).catch(() => ({}));
  const ratingsDirtPromise = fetch('horse_ratings_dirt.json').then(r => r.json()).catch(() => ({}));
  const conditionsPromise = fetch('horse_best_conditions.json').then(r => r.json()).catch(() => ({}));
  // 2026/7/23確定(成果147、TAISUKE提案): 性別・年齢の軽量な別ファイル
  const sexAgePromise = fetch('horse_sex_age.json').then(r => r.json()).catch(() => ({}));
  // 2026/7/23確定(成果161、TAISUKE提案): 前後半3F/4F・騎手の軽量な別ファイル
  // (直近版・過去版の2ファイル)
  const extraStatsPromise = fetch('horse_extra_stats.json').then(r => r.json()).catch(() => ({}));
  const extraStatsArchivePromise = fetch('horse_extra_stats_archive.json').then(r => r.json()).catch(() => ({}));
  loadingPromise = Promise.all([dataPromise, archiveDataPromise, ratingsPromise, ratingsDirtPromise, conditionsPromise, sexAgePromise, extraStatsPromise, extraStatsArchivePromise]).then(([data, archiveData, ratings, ratingsDirt, conditions, sexAge, extraStats, extraStatsArchive]) => {
    // 直近版・過去版をマージ(各馬、直近→過去の順に既にソート済みのため、
    // 単純に連結するだけで、日付降順が維持される)
    const mergedData = Object.assign({}, data);
    Object.keys(archiveData).forEach(name => {
      mergedData[name] = mergedData[name] ? mergedData[name].concat(archiveData[name]) : archiveData[name];
    });
    horseData = mergedData;
    horseRatings = ratings;
    horseRatingsDirt = ratingsDirt;
    horseBestConditions = conditions;
    horseSexAge = sexAge;
    horseExtraStats = Object.assign({}, extraStats, extraStatsArchive);
    return mergedData;
  });
  return loadingPromise;
}

function buildRadarChartSvg(ratings, customLabels) {
  // 2026/7/23確定(成果133、TAISUKE提案): 芝は3軸(先行力・キレ・展開耐性)に
  // 全面刷新。ダートは、既存の5軸(基礎スピード・キレ・持続力・ポテンシャル・
  // ギアチェンジ)のまま維持しているため、この関数はratings配列の長さに応じて、
  // 3軸(三角形)・5軸(五角形)の両方に対応する汎用設計にした
  const defaultLabels5 = ['基礎スピード','キレ','持続力','ポテンシャル','ギア'];
  const defaultLabels3 = ['先行力','キレ','展開耐性'];
  const n = ratings.length;
  const labels = customLabels || (n === 3 ? defaultLabels3 : defaultLabels5);
  const cx = 110, cy = 100, maxR = 62;
  const points = ratings.map((v, i) => {
    const angle = (Math.PI * 2 * i / n) - Math.PI / 2;
    const r = maxR * (v / 100);
    return [cx + r * Math.cos(angle), cy + r * Math.sin(angle)];
  });
  const polygonPoints = points.map(p => p.join(',')).join(' ');

  let gridHtml = '';
  for (let level = 1; level <= 5; level++) {
    const r = maxR * (level * 2 / 10);
    const gridPoints = [];
    for (let i = 0; i < n; i++) {
      const angle = (Math.PI * 2 * i / n) - Math.PI / 2;
      gridPoints.push([cx + r * Math.cos(angle), cy + r * Math.sin(angle)].join(','));
    }
    gridHtml += `<polygon points="${gridPoints.join(' ')}" fill="none" stroke="#ddd" stroke-width="1"/>`;
  }

  let labelHtml = '';
  for (let i = 0; i < n; i++) {
    const angle = (Math.PI * 2 * i / n) - Math.PI / 2;
    const lx = cx + (maxR + 24) * Math.cos(angle);
    const ly = cy + (maxR + 24) * Math.sin(angle);
    labelHtml += `<text x="${lx}" y="${ly}" font-size="11" text-anchor="middle" dominant-baseline="middle" fill="#333">${labels[i]}(${ratings[i]})</text>`;
  }

  return `<svg width="240" height="210" viewBox="0 0 220 210" style="display:block; margin:8px auto;">
    ${gridHtml}
    <polygon points="${polygonPoints}" fill="rgba(255,102,0,0.35)" stroke="#ff6600" stroke-width="2"/>
    ${labelHtml}
  </svg>`;
}

function buildParameterBars(ratings, customLabels) {
  // 2026/7/23確定(成果134、TAISUKE提案): 3軸化(成果133)により、三角形の
  // レーダーチャートは見た目のバランスが悪く分かりにくいとの指摘を受け、
  // パラメータバー形式に変更した。100点満点の横棒グラフで、各軸の値を
  // 直感的に比較できるようにする
  const defaultLabels3 = ['先行力','キレ','展開耐性'];
  const labels = customLabels || defaultLabels3;
  let html = '<div style="padding:6px 12px; max-width:280px; margin:0 auto;">';
  for (let i = 0; i < ratings.length; i++) {
    const pct = Math.max(0, Math.min(100, ratings[i]));
    const barColor = pct >= 70 ? '#ff6600' : (pct >= 50 ? '#ffb066' : '#ccc');
    html += `
      <div style="margin-bottom:8px;">
        <div style="display:flex; justify-content:space-between; font-size:12px; color:#555; margin-bottom:2px;">
          <span>${labels[i]}</span><span style="font-weight:bold;">${ratings[i]}</span>
        </div>
        <div style="background:#eee; border-radius:5px; height:10px; overflow:hidden;">
          <div style="background:${barColor}; width:${pct}%; height:100%; border-radius:5px;"></div>
        </div>
      </div>`;
  }
  html += '</div>';
  return html;
}

function raceRowHtml(e, horseName) {
  const [date, venue, distance, raceName, finish, weight, track, surface, af, pace, dashDate, rNum, archiveKey, horseType, afTopPct, rankBadge, af3katsu, raceStyle, finishTime, agari3f] = e;
  // 2026/7/23確定(成果161、TAISUKE提案): 前後半3F/4F・騎手は、サイズ超過を
  // 避けるため、entry配列ではなく、別ファイル(horseExtraStats)から
  // 「馬名|日付|会場|レース番号」のキーで取得する
  const extraKey = horseName + '|' + date + '|' + venue + '|' + rNum;
  const extra = horseExtraStats && horseExtraStats[extraKey];
  const [front3f, back3f, front4f, back4f, jockey, babaIndex] = extra || [null, null, null, null, null, null];
  let raceNameDisplay = raceName;
  if (archiveKey) {
    raceNameDisplay = '<a href="race.html?key=' + encodeURIComponent(archiveKey) + '">' + raceName + '</a>';
  } else if (dashDate) {
    raceNameDisplay = '<a href="dashboard_' + dashDate + '.html#' + venue + '_' + rNum + '">' + raceName + '</a>';
  }
  let afDisplay = '';
  if (af !== null) {
    const cls = af < 0 ? 'af-good' : 'af-bad';
    const pctStr = (afTopPct !== undefined && afTopPct !== null) ? '(上位' + afTopPct.toFixed(1) + '%)' : '';
    const badgeStr = rankBadge ? ' <span style="background:#d4af37; color:#000; font-size:10px; padding:1px 5px; border-radius:8px; font-weight:bold;">' + rankBadge + '</span>' : '';
    const af3kStr = (af3katsu !== undefined && af3katsu !== null) ? ' <span class="af-badge ' + (af3katsu < 0 ? 'af-good' : 'af-bad') + '" style="font-size:10px;">3勝クラス基準AF ' + af3katsu.toFixed(2) + '%</span>' : '';
    afDisplay = '<span class="af-badge ' + cls + '">AF ' + af.toFixed(2) + '%' + pctStr + '</span>' + badgeStr + af3kStr;
  }
  // 2026/7/23確定(成果130、TAISUKE提案): ペースの隣に、脚質・走破時計・上り3Fを追加。
  // 見やすさのため、これらは改行して2行目に表示する。
  // 2026/7/23追加(成果155、TAISUKE提案): 騎手・前後半3F/4F(ラップ補正後)を、
  // 3行目に追加表示する
  function formatFinishTime(sec) {
    if (sec === null || sec === undefined) return null;
    const m = Math.floor(sec / 60);
    const s = (sec - m * 60).toFixed(1);
    return m + ':' + (s < 10 ? '0' : '') + s;
  }
  const styleLabelMap = {'逃':'逃げ', '先':'先行', '差':'差し', '追':'追込'};
  const styleStr = raceStyle ? (styleLabelMap[raceStyle] || raceStyle) : '';
  const timeStr = formatFinishTime(finishTime);
  const agariStr = (agari3f !== null && agari3f !== undefined) ? agari3f.toFixed(1) : '';
  let paceDisplay = pace ? ' / ' + pace : '';
  const extraLine = (styleStr || timeStr || agariStr)
    ? '<div style="font-size:11px; color:#777; margin-top:2px;">' +
      [styleStr, timeStr ? '走破' + timeStr : '', agariStr ? '上り3F ' + agariStr : ''].filter(Boolean).join(' / ') +
      '</div>'
    : '';
  const splitStr = (front3f !== undefined && front3f !== null && back3f !== undefined && back3f !== null)
    ? '前3F ' + front3f.toFixed(1) + '/後3F ' + back3f.toFixed(1) + '/前4F ' + front4f.toFixed(1) + '/後4F ' + back4f.toFixed(1) : '';
  const jockeyStr = jockey ? '騎手:' + jockey : '';
  // 2026/7/23確定(成果162、TAISUKE提案): 馬場指数(その日・その会場の基準タイムからの
  // 乖離率、AF計算の内部補正と同じ値)を、参考値として表示する
  const babaStr = (babaIndex !== undefined && babaIndex !== null) ? '馬場指数' + (babaIndex >= 0 ? '+' : '') + babaIndex.toFixed(1) + '%' : '';
  const extraLine2 = (splitStr || jockeyStr || babaStr)
    ? '<div style="font-size:11px; color:#777; margin-top:2px;">' +
      [jockeyStr, babaStr, splitStr].filter(Boolean).join(' / ') +
      '</div>'
    : '';
  // 2026/7/23確定(成果167、TAISUKE提案): 1着の場合、黄色いボックスで
  // 数字を強調表示し、過去の勝ち鞍を一目でわかりやすくする
  // 2026/7/23確定(成果167バグ修正、TAISUKE提案): 着順が「1.0」のような
  // 小数形式で保存されているケースがあり、文字列「1」との厳密一致では
  // 検出できていなかった。数値変換して比較するよう修正
  const finishDisplay = (parseFloat(finish) === 1)
    ? '<span style="background:#ffd700; color:#333; font-weight:bold; padding:1px 6px; border-radius:4px;">' + finish + '</span>着'
    : finish + '着';
  return '<div class="race-row">' + date + ' ' + venue + distance + 'm(' + surface + ') ' +
         raceNameDisplay + ' / ' + finishDisplay + ' / 馬場:' + (track || '-') + paceDisplay + afDisplay + extraLine + extraLine2 + '</div>';
}

function showHorseDetail(name) {
  let races = horseData[name];
  if (!races) {
    // 名前の完全一致に失敗した場合、前後の空白を除去して再試行(成果84)
    const trimmedName = name.trim();
    races = horseData[trimmedName];
    if (races) { name = trimmedName; }
  }
  if (!races) {
    document.getElementById('resultsArea').innerHTML =
      '<a href="#" onclick="renderSearchResults(document.getElementById(\'searchBox\').value); return false;" class="back-link">‹ 検索結果に戻る</a>' +
      '<p style="padding:20px; color:#888;">「' + name + '」のデータが見つかりませんでした。検索ボックスから名前を確認してください。</p>';
    return;
  }
  // 2026/7/23確定(成果110、TAISUKE提案): 馬名の下の表示を、①ワッペン、
  // ②総合力・全体順位・得意距離順位、③得意条件(距離・馬場・ペース)、の
  // 3行構成に全面再構成。従来のAF平均バッジ・得意距離レンジ表示は削除。
  // 2026/7/23追加(成果117、TAISUKE提案): ダート版レーダーチャートにも対応し、
  // 芝・ダート両方のデータがあれば、両方のブロックを表示するよう拡張。
  // 2026/7/23追加(成果133、TAISUKE提案): 芝は3軸(先行力・キレ・展開耐性)に
  // 全面刷新。2026/7/23追加(成果135): ダートも同じ3軸ロジックに統一したため、
  // 5軸ラベルは廃止した。2026/7/23追加(成果134、TAISUKE提案): 三角形の
  // レーダーチャートは見た目のバランスが悪いため、パラメータバー形式に変更した
  let html = '<a href="#" onclick="renderSearchResults(document.getElementById(\'searchBox\').value); return false;" class="back-link">‹ 検索結果に戻る</a>';
  const typeAxisLabels3 = ['🏃先行力型','✨キレ型','🎯展開耐性型'];

  function buildRadarBlock(ratingsEntry, surfaceLabel) {
    if (!ratingsEntry || !ratingsEntry.ratings) return '';
    const ratings = ratingsEntry.ratings;
    const typeAxisLabels = typeAxisLabels3;
    let maxIdx = 0;
    for (let i = 1; i < ratings.length; i++) { if (ratings[i] > ratings[maxIdx]) maxIdx = i; }
    const surfaceTag = '<span style="font-size:11px; color:#888; margin-right:4px;">[' + surfaceLabel + ']</span>';
    const corneringStr = (ratingsEntry.corneringPower !== undefined && ratingsEntry.corneringPower !== null)
      ? ' <span class="type-badge" style="font-size:12px; background:#0a7d3c; color:#fff; padding:2px 8px; border-radius:10px;" title="3角→4角の順位変動から算出、総合力には含まれない">🌀コーナリング加速力 ' + ratingsEntry.corneringPower + '</span>'
      : '';
    // 2026/7/23確定(成果166、TAISUKE提案): 主・副の脚質バッジを、タイプ・
    // コーナリング加速力の隣に追加する(捲り含む5分類、直近10走から判定)
    let styleStr = '';
    if (ratingsEntry.runningStyle && ratingsEntry.runningStyle[0]) {
      const mainStyle = ratingsEntry.runningStyle[0];
      const subStyle = ratingsEntry.runningStyle[1];
      const styleLabel = mainStyle + (subStyle ? '(副:' + subStyle + ')' : '');
      styleStr = ' <span class="type-badge" style="font-size:12px; background:#6a4c93; color:#fff; padding:2px 8px; border-radius:10px;" title="直近10走の脚質から判定(捲り含む5分類)">🏇' + styleLabel + '</span>';
    }
    const typeBadgeLine = '<div style="margin-bottom:2px;">' + surfaceTag + '<span class="type-badge" style="font-size:12px; background:#333; color:#fff; padding:2px 8px; border-radius:10px;" title="走破スタイル・レーダーチャートの最高軸(' + ratings[maxIdx] + '点)">' + typeAxisLabels[maxIdx] + '</span>' + corneringStr + styleStr + '</div>';
    let bucketRankStr = '';
    if (ratingsEntry.bucketRank && ratingsEntry.bucketN) {
      const rangeMatch = ratingsEntry.bestBucket.match(/\(([^)]+)\)/);
      const rangeLabel = rangeMatch ? rangeMatch[1] + 'm' : ratingsEntry.bestBucket;
      bucketRankStr = '　' + rangeLabel + ' ' + ratingsEntry.bucketRank + '／' + ratingsEntry.bucketN + '位';
    }
    const totalLine = '<div style="font-size:13px; margin-bottom:2px;">総合力 ' + ratingsEntry.total + '点　全体 ' + ratingsEntry.totalRank + '／' + ratingsEntry.totalN + '位' + bucketRankStr + '</div>';
    let block = typeBadgeLine + totalLine;
    block += '<div style="background:#fafafa; border:1px solid #eee; border-radius:8px; padding:10px; margin-bottom:12px;">' +
             buildParameterBars(ratings) + '</div>';
    return block;
  }

  // 2026/7/23確定(成果146・147、TAISUKE提案): 馬名の隣に性別・年齢を表示する。
  // 軽量な別ファイル(horse_sex_age.json、[日付,性別,年齢]形式)から取得する
  let sexAgeHeaderStr = '';
  const sexAgeEntry = horseSexAge && horseSexAge[name];
  if (sexAgeEntry) {
    sexAgeHeaderStr = '(' + sexAgeEntry[1] + sexAgeEntry[2] + ')';
  }
  html += '<h2>' + name + sexAgeHeaderStr + '(' + races.length + '走)</h2>';
  const ratingsEntryTurf = horseRatings && horseRatings[name];
  const ratingsEntryDirt = horseRatingsDirt && horseRatingsDirt[name];
  html += buildRadarBlock(ratingsEntryTurf, '芝');
  html += buildRadarBlock(ratingsEntryDirt, 'ダート');
  const bestCondition = horseBestConditions && horseBestConditions[name];
  if (bestCondition) {
    html += '<div style="font-size:13px; margin-bottom:8px;">得意条件：' + bestCondition + '</div>';
  }
  races.forEach(e => { html += raceRowHtml(e, name); });
  document.getElementById('resultsArea').innerHTML = html;
}

function renderSearchResults(query) {
  if (!query || query.length < 1) {
    document.getElementById('resultsArea').innerHTML = '';
    return;
  }
  const matches = Object.keys(horseData).filter(name => name.includes(query)).slice(0, 50);
  if (matches.length === 0) {
    document.getElementById('resultsArea').innerHTML = '<div class="loading">該当する馬が見つかりません</div>';
    return;
  }
  let html = '';
  matches.forEach(name => {
    html += '<div class="result-item" onclick="showHorseDetail(\'' + name.replace(/'/g, "\\'") + '\')">' + name + '(' + horseData[name].length + '走)</div>';
  });
  document.getElementById('resultsArea').innerHTML = html;
}

function getParam(name) {
  const params = new URLSearchParams(window.location.search);
  return params.get(name);
}

document.getElementById('searchBox').addEventListener('input', function(e) {
  const query = e.target.value;
  if (!horseData) {
    loadData().then(() => renderSearchResults(query));
  } else {
    renderSearchResults(query);
  }
});

const initialName = getParam('name');
if (initialName) {
  loadData().then(() => showHorseDetail(initialName));
}
</script>
